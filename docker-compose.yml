version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Optional: environment variables for backend
    # environment:
    #   - DATASET_STORAGE_PATH=/data
    # volumes:
    #   - ./data:/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"        # Access frontend on http://localhost
    depends_on:
      - backend
    # If using nginx proxy, no extra config needed