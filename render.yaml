services:
  - type: web
    name: automl-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGINS
        value: https://automl-frontend.onrender.com,http://localhost:5173,http://localhost

  - type: web
    name: automl-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://automl-backend.onrender.com